services:
  backend:
    build: ./backend
    container_name: zaytoon-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    volumes:
      - backend-data:/app/data
      - model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        # The port a browser will actually reach. The image's redirect target is
        # built from this, so it must be the published port below (3443), not the
        # container's 8443 — a redirect to an unpublished port is a dead end that
        # looks like a broken backend.
        HTTPS_PORT: "3443"
    container_name: zaytoon-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
      - "3443:8443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro
    stop_grace_period: 10s

volumes:
  backend-data:
  model-cache: