name: CI — Visual QA (browser)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-qa:
    name: Browser-based visual QA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # playwright is a devDependency; npm ci installs it from package-lock.json
        run: npm ci

      - name: Install Chromium browser binary
        run: npx playwright install --with-deps chromium

      - name: Build frontend (production)
        run: npm run build

      - name: Start preview server
        run: npm run preview -- --port 5173 &
        # preview server starts in background; the runner terminates it when the job ends

      - name: Wait for server readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then echo "ready"; exit 0; fi
            sleep 1
          done
          echo "server did not become ready" >&2
          exit 1

      - name: Run visual QA tests
        run: npx playwright test tests/visual-qa.spec.js

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
